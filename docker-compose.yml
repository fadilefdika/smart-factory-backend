version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartfactory_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      # The default database will be created, and our init script will create the rest
      POSTGRES_DB: default_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartfactory_mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    container_name: smartfactory_influx
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: smartfactory
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: super-secret-token-12345
    volumes:
      - influxdata:/var/lib/influxdb2
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: smartfactory_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
  influxdata:
  miniodata:
